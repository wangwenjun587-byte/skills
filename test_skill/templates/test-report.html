<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill 冒烟测试报告</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --card-border: #2a2d3a;
      --text: #e4e4e7;
      --text-dim: #9ca3af;
      --accent: #3b82f6;
      --green: #22c55e;
      --yellow: #eab308;
      --orange: #f97316;
      --red: #ef4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 24px;
    }
    .container { max-width: 1000px; margin: 0 auto; }

    /* Header */
    .header { text-align: center; padding: 36px 20px 24px; }
    .header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
    .header .subtitle { color: var(--text-dim); font-size: 13px; margin-top: 6px; }

    /* Summary Card */
    .summary-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 20px;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 20px;
    }
    .summary-item { text-align: center; }
    .summary-item .label {
      font-size: 11px; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px;
    }
    .summary-item .value { font-size: 30px; font-weight: 700; }
    .summary-item .value.green { color: var(--green); }
    .summary-item .value.red { color: var(--red); }
    .summary-item .value.blue { color: var(--accent); }
    .summary-item .value.dim { color: var(--text-dim); }

    /* Pass Rate Bar */
    .rate-bar { margin-bottom: 20px; }
    .rate-bar-header { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; }
    .rate-bar-track {
      width: 100%; height: 12px; background: rgba(255,255,255,0.06);
      border-radius: 6px; overflow: hidden; display: flex;
    }
    .rate-bar-pass { height: 100%; background: var(--green); transition: width 0.6s; }
    .rate-bar-fail { height: 100%; background: var(--red); transition: width 0.6s; }
    .rate-bar-skip { height: 100%; background: var(--text-dim); opacity: 0.3; transition: width 0.6s; }

    /* Sections */
    .section {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
    }
    .section-title {
      font-size: 17px; font-weight: 600;
      margin-bottom: 16px; padding-bottom: 10px;
      border-bottom: 1px solid var(--card-border);
    }

    /* Skill List Table */
    .skill-table { width: 100%; border-collapse: collapse; }
    .skill-table th {
      text-align: left; padding: 10px 14px;
      font-size: 11px; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 0.5px;
      border-bottom: 1px solid var(--card-border);
    }
    .skill-table td {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      vertical-align: middle;
    }
    .skill-table tr:last-child td { border-bottom: none; }
    .skill-table tr:hover { background: rgba(255,255,255,0.02); }
    .skill-table tr.detail-row { display: none; }
    .skill-table tr.detail-row.open { display: table-row; }
    .skill-table tr.detail-row td {
      padding: 0 14px 16px 14px;
      border-bottom: 1px solid var(--card-border);
      background: rgba(0,0,0,0.15);
    }

    /* Status Badges */
    .status {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 28px; height: 24px; padding: 0 8px;
      border-radius: 6px; font-size: 12px; font-weight: 700;
    }
    .status.pass { background: rgba(34,197,94,0.15); color: var(--green); }
    .status.fail { background: rgba(239,68,68,0.15); color: var(--red); }
    .status.skip { background: rgba(156,163,175,0.15); color: var(--text-dim); }
    .status.timeout { background: rgba(249,115,22,0.15); color: var(--orange); }
    .status.error { background: rgba(239,68,68,0.15); color: var(--red); }

    /* Score colors */
    .s5 { color: var(--green); } .s4 { color: var(--accent); }
    .s3 { color: var(--yellow); } .s2 { color: var(--orange); } .s1 { color: var(--red); }

    /* Score mini bars */
    .score-mini { display: flex; gap: 2px; align-items: center; }
    .score-mini-block {
      width: 6px; height: 14px; border-radius: 2px;
      transition: background 0.3s;
    }

    /* Detail Panel */
    .detail-panel { padding: 16px 0; }
    .detail-grid {
      display: grid; grid-template-columns: repeat(7, 1fr);
      gap: 10px; margin-bottom: 12px;
    }
    .detail-dim {
      text-align: center; padding: 10px 4px;
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
    }
    .detail-dim .dim-label { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
    .detail-dim .dim-val { font-size: 20px; font-weight: 700; }

    /* Radar in detail */
    .detail-chart { max-width: 300px; margin: 0 auto 12px; }

    /* Issue list */
    .issue-list { display: flex; flex-direction: column; gap: 8px; }
    .issue {
      padding: 12px; border-radius: 8px;
      border-left: 3px solid;
    }
    .issue.p0 { background: rgba(239,68,68,0.06); border-color: var(--red); }
    .issue.p1 { background: rgba(249,115,22,0.06); border-color: var(--orange); }
    .issue.p2 { background: rgba(234,179,8,0.06); border-color: var(--yellow); }
    .issue-header { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .issue-tag {
      font-size: 10px; font-weight: 700; padding: 1px 6px;
      border-radius: 3px; text-transform: uppercase;
    }
    .issue.p0 .issue-tag { background: rgba(239,68,68,0.2); color: var(--red); }
    .issue.p1 .issue-tag { background: rgba(249,115,22,0.2); color: var(--orange); }
    .issue.p2 .issue-tag { background: rgba(234,179,8,0.2); color: var(--yellow); }
    .issue-desc { font-size: 13px; }
    .issue-evidence { font-size: 12px; color: var(--text-dim); }

    /* Expand toggle */
    .expand-btn {
      cursor: pointer; user-select: none;
      background: none; border: none; color: var(--accent);
      font-size: 12px; padding: 2px 6px; border-radius: 4px;
    }
    .expand-btn:hover { background: rgba(59,130,246,0.1); }

    /* Footer */
    .footer { text-align: center; padding: 28px 0; color: var(--text-dim); font-size: 11px; }

    /* Responsive */
    @media (max-width: 768px) {
      .summary-grid { grid-template-columns: repeat(2, 1fr); }
      .detail-grid { grid-template-columns: repeat(4, 1fr); }
      .skill-table .hide-mobile { display: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Skill 冒烟测试报告</h1>
      <div class="subtitle" id="subtitle">由 test-skill 调度器自动生成</div>
    </div>

    <!-- Summary -->
    <div class="summary-card">
      <div class="summary-grid">
        <div class="summary-item">
          <div class="label">Skill 总数</div>
          <div class="value blue" id="s-total">—</div>
        </div>
        <div class="summary-item">
          <div class="label">通过</div>
          <div class="value green" id="s-pass">—</div>
        </div>
        <div class="summary-item">
          <div class="label">失败</div>
          <div class="value red" id="s-fail">—</div>
        </div>
        <div class="summary-item">
          <div class="label">跳过</div>
          <div class="value dim" id="s-skip">—</div>
        </div>
      </div>
      <div class="rate-bar">
        <div class="rate-bar-header">
          <span>通过率</span>
          <span id="rate-pct">—</span>
        </div>
        <div class="rate-bar-track">
          <div class="rate-bar-pass" id="bar-pass" style="width:0%"></div>
          <div class="rate-bar-fail" id="bar-fail" style="width:0%"></div>
          <div class="rate-bar-skip" id="bar-skip" style="width:0%"></div>
        </div>
      </div>
    </div>

    <!-- Skill List -->
    <div class="section">
      <div class="section-title">测试结果一览</div>
      <table class="skill-table">
        <thead>
          <tr>
            <th style="width:36px">#</th>
            <th>Skill</th>
            <th style="text-align:center">状态</th>
            <th style="text-align:center">分数</th>
            <th class="hide-mobile">7 维度</th>
            <th class="hide-mobile">关键发现</th>
            <th style="width:50px"></th>
          </tr>
        </thead>
        <tbody id="skill-tbody"></tbody>
      </table>
    </div>

    <!-- All Issues (aggregated) -->
    <div class="section" id="issues-section" style="display:none;">
      <div class="section-title">所有问题汇总</div>
      <div class="issue-list" id="issue-list"></div>
    </div>

    <div class="footer">
      <p>test-skill · Skill 冒烟测试调度器 · 由 darwin-skill 测试逻辑提炼</p>
      <p style="margin-top:4px;">测试时间：<span id="test-time">—</span></p>
    </div>
  </div>

  <script>
    // === 数据入口 ===
    // 执行完测试后，将实际数据替换此对象，然后渲染报告
    const DATA = {
      testTime: "2026-05-22 15:30",
      skills: [
        {
          name: "去AI味",
          status: "pass",
          totalScore: 26,
          dimensions: [
            { name: "输出质量", score: 5 },
            { name: "稳定性", score: 4 },
            { name: "幻觉检测", score: 4 },
            { name: "Prompt遵循", score: 3 },
            { name: "Tool调用", score: 3 },
            { name: "上下文记忆", score: 4 },
            { name: "异常处理", score: 3 }
          ],
          findings: "改写质量高，异常处理和中文规则有改进空间",
          issues: [
            { level: "P1", dimension: "异常处理", desc: "代码块内容会被误改写", evidence: "无代码块豁免规则" }
          ]
        },
        {
          name: "内容总结",
          status: "pass",
          totalScore: 29,
          dimensions: [
            { name: "输出质量", score: 5 },
            { name: "稳定性", score: 4 },
            { name: "幻觉检测", score: 4 },
            { name: "Prompt遵循", score: 5 },
            { name: "Tool调用", score: 4 },
            { name: "上下文记忆", score: 4 },
            { name: "异常处理", score: 3 }
          ],
          findings: "URL/PDF 总结稳定可靠",
          issues: []
        },
        {
          name: "AI绘图",
          status: "fail",
          totalScore: 16,
          dimensions: [
            { name: "输出质量", score: 3 },
            { name: "稳定性", score: 2 },
            { name: "幻觉检测", score: 4 },
            { name: "Prompt遵循", score: 3 },
            { name: "Tool调用", score: 1 },
            { name: "上下文记忆", score: 2 },
            { name: "异常处理", score: 1 }
          ],
          findings: "ImageGen 参数错误，超时无降级",
          issues: [
            { level: "P0", dimension: "Tool调用", desc: "ImageGen 参数格式错误", evidence: "调用返回参数校验失败" },
            { level: "P1", dimension: "异常处理", desc: "超时后无优雅降级", evidence: "等待超时后直接报错退出" }
          ]
        },
        {
          name: "wechat-qq-sender",
          status: "skip",
          skipReason: "requires_auth",
          totalScore: 0,
          dimensions: [],
          findings: "需要微信/QQ 登录态",
          issues: []
        }
      ]
    };

    const DIM_LABELS = ["输出质量","稳定性","幻觉检测","Prompt遵循","Tool调用","上下文记忆","异常处理"];

    function scoreColor(s) {
      if (s >= 4) return "var(--green)";
      if (s === 3) return "var(--yellow)";
      return "var(--red)";
    }

    function render(data) {
      document.getElementById("test-time").textContent = data.testTime;

      // Summary
      const total = data.skills.length;
      const pass = data.skills.filter(s => s.status === "pass").length;
      const fail = data.skills.filter(s => s.status === "fail").length;
      const skip = data.skills.filter(s => s.status === "skip").length;

      document.getElementById("s-total").textContent = total;
      document.getElementById("s-pass").textContent = pass;
      document.getElementById("s-fail").textContent = fail;
      document.getElementById("s-skip").textContent = skip;

      const rate = total > 0 ? Math.round(pass / total * 100) : 0;
      document.getElementById("rate-pct").textContent = rate + "%";
      document.getElementById("bar-pass").style.width = (pass/total*100) + "%";
      document.getElementById("bar-fail").style.width = (fail/total*100) + "%";
      document.getElementById("bar-skip").style.width = (skip/total*100) + "%";

      // Table
      const tbody = document.getElementById("skill-tbody");
      tbody.innerHTML = "";

      data.skills.forEach((sk, i) => {
        // Main row
        const tr = document.createElement("tr");
        tr.className = "main-row";

        const statusLabel = { pass: "PASS", fail: "FAIL", skip: "SKIP", timeout: "TIMEOUT", error: "ERROR" }[sk.status] || sk.status.toUpperCase();
        const statusIcon = { pass: "✅", fail: "❌", skip: "⏭️", timeout: "⏰", error: "💥" }[sk.status] || "❓";

        // Mini score blocks
        let miniHtml = '<div class="score-mini">';
        if (sk.dimensions.length > 0) {
          sk.dimensions.forEach(d => {
            miniHtml += `<div class="score-mini-block" style="background:${scoreColor(d.score)}"></div>`;
          });
        } else {
          miniHtml += '<span style="font-size:11px;color:var(--text-dim)">N/A</span>';
        }
        miniHtml += '</div>';

        tr.innerHTML = `
          <td style="color:var(--text-dim)">${i + 1}</td>
          <td style="font-weight:500">${sk.name}</td>
          <td style="text-align:center"><span class="status ${sk.status}">${statusIcon} ${statusLabel}</span></td>
          <td style="text-align:center;font-weight:700;${sk.totalScore > 0 ? 'color:' + scoreColor(sk.totalScore / 7) : 'color:var(--text-dim)'}">${sk.totalScore > 0 ? sk.totalScore + '/35' : '—'}</td>
          <td class="hide-mobile">${miniHtml}</td>
          <td class="hide-mobile" style="font-size:13px;color:var(--text-dim);max-width:240px">${sk.findings}</td>
          <td>${sk.status !== 'skip' && sk.dimensions.length > 0 ? '<button class="expand-btn" onclick="toggleDetail(' + i + ')">展开</button>' : ''}</td>
        `;
        tbody.appendChild(tr);

        // Detail row (hidden by default)
        const dtr = document.createElement("tr");
        dtr.className = "detail-row";
        dtr.id = `detail-${i}`;
        let detailHtml = '<td colspan="7"><div class="detail-panel">';
        if (sk.dimensions.length > 0) {
          detailHtml += '<div class="detail-grid">';
          sk.dimensions.forEach(d => {
            detailHtml += `<div class="detail-dim"><div class="dim-label">${d.name}</div><div class="dim-val s${d.score}">${d.score}</div></div>`;
          });
          detailHtml += '</div>';
          detailHtml += `<div class="detail-chart"><canvas id="chart-${i}"></canvas></div>`;
        }
        if (sk.skipReason) {
          detailHtml += `<div style="color:var(--text-dim);font-size:13px;margin-bottom:8px">跳过原因：${sk.skipReason}</div>`;
        }
        if (sk.issues && sk.issues.length > 0) {
          detailHtml += '<div class="issue-list">';
          sk.issues.forEach(iss => {
            detailHtml += `<div class="issue ${iss.level}">
              <div class="issue-header"><span class="issue-tag">${iss.level}</span><span style="font-size:12px;color:var(--text-dim)">${iss.dimension}</span></div>
              <div class="issue-desc">${iss.desc}</div>
              ${iss.evidence ? '<div class="issue-evidence">' + iss.evidence + '</div>' : ''}
            </div>`;
          });
          detailHtml += '</div>';
        }
        detailHtml += '</div></td>';
        dtr.innerHTML = detailHtml;
        tbody.appendChild(dtr);
      });

      // All issues aggregated
      const allIssues = data.skills.flatMap(sk => (sk.issues || []).map(iss => ({ ...iss, skillName: sk.name })));
      if (allIssues.length > 0) {
        document.getElementById("issues-section").style.display = "block";
        const list = document.getElementById("issue-list");
        list.innerHTML = "";
        allIssues.forEach(iss => {
          const div = document.createElement("div");
          div.className = `issue ${iss.level}`;
          div.innerHTML = `
            <div class="issue-header">
              <span class="issue-tag">${iss.level}</span>
              <span style="font-size:12px;color:var(--text-dim)">${iss.skillName} · ${iss.dimension}</span>
            </div>
            <div class="issue-desc">${iss.desc}</div>
            ${iss.evidence ? '<div class="issue-evidence">' + iss.evidence + '</div>' : ''}
          `;
          list.appendChild(div);
        });
      }
    }

    // Toggle detail
    function toggleDetail(idx) {
      const row = document.getElementById(`detail-${idx}`);
      row.classList.toggle("open");
      if (row.classList.contains("open")) {
        const btn = row.previousElementSibling.querySelector('.expand-btn');
        if (btn) btn.textContent = '收起';
        // Render mini radar
        const sk = DATA.skills[idx];
        if (sk.dimensions.length > 0) {
          setTimeout(() => {
            const canvas = document.getElementById(`chart-${idx}`);
            if (canvas && !canvas._chartRendered) {
              canvas._chartRendered = true;
              new Chart(canvas.getContext("2d"), {
                type: "radar",
                data: {
                  labels: sk.dimensions.map(d => d.name),
                  datasets: [{
                    data: sk.dimensions.map(d => d.score),
                    backgroundColor: "rgba(59,130,246,0.1)",
                    borderColor: "rgba(59,130,246,0.6)",
                    borderWidth: 1.5,
                    pointBackgroundColor: sk.dimensions.map(d => d.score >= 4 ? "#22c55e" : d.score === 3 ? "#eab308" : "#ef4444"),
                    pointRadius: 3
                  }]
                },
                options: {
                  responsive: true,
                  scales: { r: { beginAtZero: true, max: 5, min: 0, ticks: { stepSize: 1, color: "#6b7280", backdropColor: "transparent", font: { size: 9 } }, grid: { color: "rgba(255,255,255,0.05)" }, angleLines: { color: "rgba(255,255,255,0.05)" }, pointLabels: { color: "#9ca3af", font: { size: 10 } } } },
                  plugins: { legend: { display: false } }
                }
              });
            }
          }, 50);
        }
      } else {
        const btn = row.previousElementSibling.querySelector('.expand-btn');
        if (btn) btn.textContent = '展开';
      }
    }

    render(DATA);
  </script>
</body>
</html>
